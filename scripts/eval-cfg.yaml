queries_csv: data/qa_golden.csv
golden_csv: data/qa_golden.csv

output:
  root: data/eval_runs
  run_name: ragflow_grid
  overwrite: false
  command_timeout_seconds: 3600

logging:
  # INFO keeps task progress and request metadata; DEBUG adds HTTP payload summaries.
  level: INFO

datasets:
  - id: "123"
    name: custom
  - id: "345"
    name: trd

grid:
  page_sizes: [5, 10]
  similarity_thresholds: [0.1, 0.2]

generation:
  retrieval_url: "http://localhost:9380/api/v1/retrieval"
  retrieval_api_key_env: RETRIEVAL_API_KEY
  top_k: 1024
  rerank_id: ""
  vector_similarity_weight: 0.3
  repeat_query: 1
  max_workers: 1
  timeout: 120
  retries: 2
  llm_base_url: "http://localhost:8000/v1"
  llm_api_key: "EMPTY"
  llm_model: "mock-chat"
  max_tokens: 4096

evaluation:
  chat_base_url: "http://localhost:8000/v1"
  chat_api_key: "EMPTY"
  chat_model: "mock-chat"
  embedding_base_url: "http://localhost:8000/v1"
  embedding_api_key: "EMPTY"
  embedding_model: "mock-embedding"
  k_values: "1,3,5"
  max_workers: 1
  timeout: 60
  retries: 0
  max_tokens: 2048
  chat_extra_body_json: '{"thinking":{"type":"disabled"}}'
